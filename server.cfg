endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "Lexar Roleplay"
sv_maxclients 48
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# set onesync on
set sv_enforceGameBuild 3407

sv_licenseKey "GANTI_LICENSE_KEY_CFX"
set steam_webApiKey "GANTI_STEAM_WEB_API_KEY"
set mysql_connection_string "mysql://GANTI_USER:GANTI_PASS@localhost/lexar?charset=utf8mb4"
set mysql_slow_query_warning 200

setr ox:locale "en"
setr inventory:framework "qb"

add_ace group.god   command allow
add_ace group.admin qbadmin.join allow
add_principal group.god   group.admin
add_principal group.admin group.mod

ensure queue
ensure mapmanager
ensure spawnmanager
ensure sessionmanager
ensure baseevents
ensure PolyZone
ensure oxmysql
ensure ox_lib
ensure sm_core
ensure se_v2
ensure ox_inventory
ensure ox_target
ensure ox_doorlock
ensure pma-voice

exec secret.cfg
exec resources.cfg

set sv_listingIpOverride "180.252.248.214:30120"
