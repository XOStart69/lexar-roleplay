## Lexar Roleplay - server.cfg (template rekonstruksi)
## Ganti semua nilai bertanda GANTI_... sebelum dijalankan. Jangan bagikan file ini setelah diisi.

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "Lexar Roleplay"
sets sv_projectName "Lexar Roleplay"
sets sv_projectDesc "Lexar Roleplay"
sets locale "id-ID"
sv_maxclients 48
set onesync on
# sv_enforceGameBuild 3095   # isi sesuai DLC map/mobil yang dipakai (casino/cayo/mansion mod biasanya perlu build baru)

sv_licenseKey "GANTI_LICENSE_KEY_CFX"
set steam_webApiKey "GANTI_STEAM_WEB_API_KEY"      # QBConfig.LicenseType = 'steam' -> pemain wajib menjalankan Steam
set mysql_connection_string "mysql://GANTI_USER:GANTI_PASS@localhost/lexar?charset=utf8mb4"
set mysql_slow_query_warning 200

setr ox:locale "en"
setr inventory:framework "qb"                       # cek ox_inventory/setup/convars.cfg untuk opsi lain

## ---- izin (ACE) ----
add_ace group.god   command allow
add_ace group.admin qbadmin.join allow              # boleh join saat server di-close
add_principal group.god   group.admin
add_principal group.admin group.mod
# Isi identifier admin pertama kamu (format steam hex atau license):
# add_principal identifier.steam:GANTI_STEAM_HEX group.god

## ---- urutan start ----
ensure mapmanager
ensure spawnmanager
ensure sessionmanager
ensure baseevents
ensure PolyZone
ensure oxmysql
ensure ox_lib
ensure se_v2
ensure sm_core          # menyediakan 'qb-core'
ensure ox_inventory
ensure ox_target
ensure ox_doorlock

exec resources.cfg
