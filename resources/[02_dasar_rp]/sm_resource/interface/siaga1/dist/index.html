<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siaga 1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="alertBar" class="hidden">
        <div class="alert-strip"></div>
        <div class="alert-header">
            <div class="alert-header-icon"><i class="fas fa-broadcast-tower"></i></div>
            <h1>EMERGENCY BROADCAST MESSAGE</h1>
            <div class="alert-header-icon"><i class="fas fa-broadcast-tower"></i></div>
        </div>
        <div class="alert-sub">Los Santos Police Department</div>
        <div class="alert-marquee-row">
            <div class="alert-beacon"><span></span></div>
            <div class="alert-track">
                <div class="alert-scroll" id="scrollText"></div>
            </div>
            <div class="alert-beacon right"><span></span></div>
        </div>
        <div class="alert-strip"></div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
