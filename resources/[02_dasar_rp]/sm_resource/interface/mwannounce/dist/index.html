<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merryweather Announcement</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="mwBar" class="hidden">
        <div class="mw-strip"></div>
        <div class="mw-header">
            <span class="mw-dot"></span>
            <h1>MERRYWEATHER SECURITY</h1>
            <span class="mw-timer" id="mwTimer">30</span>
        </div>
        <div class="mw-sub">Forces Announcement</div>
        <div class="mw-body" id="mwText"></div>
        <div class="mw-progress"><div class="mw-progress-fill" id="mwProgress"></div></div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
