<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="main.css" />
  <script src="./js/vue.global.js"></script>
  <script src="./js/vuex.global.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.1/themes/base/jquery-ui.css" />
</head>

<body>
  <div id="app">
    <div class="minigame3" v-show="pipeGame.isActive">
      <div class="rangeBox">
        <div class="rangeGreen"></div>
        <div class="rangeLineList">
          <div class="rangeLine1"></div>
          <div class="rangeLine2"></div>
          <div class="rangeLine2"></div>
          <div class="rangeLine1"></div>
          <div class="rangeLine2"></div>
          <div class="rangeLine2"></div>
          <div class="rangeLine1"></div>
          <div class="rangeLine2"></div>
          <div class="rangeLine2"></div>
          <div class="rangeLine1"></div>
        </div>
        <div class="rangeBar">
          <div class="rangeBarIn"
            :style="{ height: `${pipeGame.pressure}%`, backgroundColor: (pipeGame.pressure >= pipeGame.targetPressureMin && pipeGame.pressure <= pipeGame.targetPressureMax) ? '#2ecc71' : '#3498db'}">
          </div>
        </div>
      </div>
    </div>

    <Transition name="slide">
      <div class="minigame" v-show="valveGame.isActive">
        <div class="speedoBox">
          <div class="speedoLine"
            :style="{ transform: `rotate(${(valveGame.pressure / valveGame.maxPressure) * 180}deg)` }"></div>
        </div>
        <div class="rangeBox">
          <div class="rangeGreen"></div>
          <div class="rangeLineList">
            <div class="rangeLine1"></div>
            <div class="rangeLine2"></div>
            <div class="rangeLine2"></div>
            <div class="rangeLine1"></div>
            <div class="rangeLine2"></div>
            <div class="rangeLine2"></div>
            <div class="rangeLine1"></div>
            <div class="rangeLine2"></div>
            <div class="rangeLine2"></div>
            <div class="rangeLine1"></div>
          </div>
          <div class="rangeBar">
            <div class="rangeBarIn"
              :style="{ height: `${valveGame.pressure}%`,backgroundColor: valveGame.pressure >= valveGame.failPressure ? 'red' : '#3498db'}">
            </div>
          </div>
        </div>
        <div class="valveBox" :style="{ transform: `rotate(${valveGame.currentRotation}deg)` }"
          @mousedown="valveMouseDown" @mouseup="valveMouseUp" @mousemove="valveMouseMove"></div>
        <img class="miniGamePipes" src="./img/pipesMinigame.png" alt="" />
        <img src="./img/minigameBorder.png" alt="" class="miniGameBorder" />
      </div>
    </Transition>
    <Transition name="slide">
      <div class="minigame2 switchMin" v-show="switchGame.isActive">
        <div class="notification" id="notification" v-if="switchGame.isActive && switchGame.notification.show">
          {{ switchGame.notification.message }}
        </div>
        <div class="lightList" v-if="switchGame.isActive">
          <div v-for="(light, index) in switchGame.lightBoxes" :key="index" class="lightBox"
            :class="{ 'green': light.isGreen, 'red': !light.isGreen }" :data-light-number="light.number">
            {{ light.number }}
          </div>
        </div>
        <div class="switchList" v-if="switchGame.isActive">
          <div v-for="i in 6" :key="i" class="switchBox" @click="toggleSwitch(i)"
            :style="{ backgroundImage: switchGame.switchStates[i] ? 'url(./img/switchon.png)' : 'url(./img/switchoff.png)' }">
            {{ i }}
          </div>
        </div>
        <img class="miniGameSwitch" src="./img/switchMinigame.png" alt="" />
        <img src="./img/minigameBorder.png" alt="" class="miniGameBorder" />
      </div>
    </Transition>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/Draggable.min.js"></script>
  <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
  <script src="https://unpkg.com/swiper@5.3.8/js/swiper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-element-bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.1.1/howler.min.js" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./js/app.js" type="module"></script>
</body>

</html>
