<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anti VDM</title>
    <style>
        html { font-size: clamp(10px, calc(100vh / 80), 20px); }
        html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; pointer-events: none; }
        #warn {
            position: absolute;
            top: 7rem;
            left: 50%;
            transform: translate(-50%, -0.8rem);
            opacity: 0;
            transition: opacity .25s ease, transform .25s ease;
            min-width: 22rem;
            max-width: 36rem;
            padding: .9rem 1.4rem;
            box-sizing: border-box;
            background: rgba(150, 18, 18, .55);
            border: 1px solid rgba(255, 90, 90, .45);
            border-radius: .5rem;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
        }
        #warn.show { opacity: 1; transform: translate(-50%, 0); }
        #warn.show { animation: flash .8s steps(1, end) infinite; }
        @keyframes flash {
            0% { background: rgba(150, 18, 18, .55); border-color: rgba(255, 90, 90, .45); }
            50% { background: rgba(150, 18, 18, .2); border-color: rgba(255, 90, 90, .15); }
        }
        #title { font-size: 1.15rem; font-weight: 700; letter-spacing: .04rem; text-transform: uppercase; }
        #count { display: inline-block; margin-left: .5rem; padding: .05rem .45rem; border-radius: .3rem; background: rgba(0, 0, 0, .3); font-size: .9rem; }
        #desc { margin-top: .3rem; font-size: .9rem; color: rgba(255, 255, 255, .85); }
        #bar { margin-top: .6rem; height: .2rem; border-radius: .1rem; background: rgba(255, 255, 255, .8); transform-origin: left; }
    </style>
</head>
<body>
    <div id="warn">
        <div><span id="title"></span><span id="count"></span></div>
        <div id="desc"></div>
        <div id="bar"></div>
    </div>
    <script>
        const warn = document.getElementById('warn');
        const title = document.getElementById('title');
        const count = document.getElementById('count');
        const desc = document.getElementById('desc');
        const bar = document.getElementById('bar');
        let hideTimer;

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data) return;

            if (data.__frameInit) {
                fetch(`https://${data.resourceName}/${data.frameId}:ready`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                    body: '{}',
                }).catch(() => {});
                return;
            }

            if (data.action !== 'warn') return;

            title.textContent = data.title;
            count.textContent = `${data.count}/${data.max}`;
            desc.textContent = data.description;

            bar.style.transition = 'none';
            bar.style.transform = 'scaleX(1)';
            void bar.offsetWidth;
            bar.style.transition = `transform ${data.duration}ms linear`;
            bar.style.transform = 'scaleX(0)';

            warn.classList.add('show');
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => warn.classList.remove('show'), data.duration);
        });
    </script>
</body>
</html>
