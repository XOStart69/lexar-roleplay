<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>sm_tv</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0f12; font-family: Arial, Helvetica, sans-serif; }
  #idle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0d0f12; color: #e6e8eb; }
  #idle h1 { margin: 0; font-size: 72px; font-weight: 700; letter-spacing: 8px; }
  #idle p { margin: 18px 0 0; font-size: 30px; color: #8a9099; }
  #stage { position: absolute; inset: 0; display: none; background: #000; }
  #stage iframe, #stage video, #stage img { width: 100%; height: 100%; border: 0; object-fit: contain; display: block; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="idle"><h1>SATU MIMPI TV</h1><p id="subtitle">Belum ada siaran</p></div>
<div id="stage"></div>
<script>
(function () {
  'use strict';

  var RESOURCE = 'sm_resource_1';
  var idle = document.getElementById('idle');
  var subtitle = document.getElementById('subtitle');
  var stage = document.getElementById('stage');

  var apiReady = false;
  var apiRequested = false;
  var queued = null;
  var player = null;
  var element = null;

  function post(name) {
    fetch('https://' + RESOURCE + '/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    }).catch(function () {});
  }

  function clear() {
    queued = null;
    if (player) {
      try { player.destroy(); } catch (e) {}
      player = null;
    }
    if (element) {
      try { element.pause(); } catch (e) {}
      element.removeAttribute('src');
      element = null;
    }
    stage.innerHTML = '';
    stage.style.display = 'none';
  }

  function showIdle(text) {
    clear();
    subtitle.textContent = text || 'Belum ada siaran';
    idle.classList.remove('hidden');
  }

  function showStage() {
    idle.classList.add('hidden');
    stage.style.display = 'block';
  }

  function loadApi() {
    if (apiRequested) return;
    apiRequested = true;
    var script = document.createElement('script');
    script.src = 'https://www.youtube.com/iframe_api';
    script.async = true;
    document.head.appendChild(script);
  }

  function playYoutube(data) {
    if (!apiReady) {
      queued = data;
      loadApi();
      return;
    }
    var host = document.createElement('div');
    host.id = 'yt';
    stage.appendChild(host);
    showStage();
    var start = Math.floor(data.time || 0);
    player = new YT.Player('yt', {
      width: '1280',
      height: '720',
      videoId: data.src,
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, rel: 0, modestbranding: 1, playsinline: 1, start: start },
      events: {
        onReady: function (event) {
          event.target.unMute();
          event.target.setVolume(data.volume);
          event.target.seekTo(start, true);
          event.target.playVideo();
        },
        onError: function () {
          showIdle('Video tidak dapat diputar');
        },
        onStateChange: function (event) {
          if (event.data === YT.PlayerState.ENDED) showIdle('Siaran selesai');
        }
      }
    });
  }

  function playElement(tag, data, visible) {
    var media = document.createElement(tag);
    media.autoplay = true;
    media.volume = data.volume / 100;
    if (tag === 'video') media.playsInline = true;
    media.addEventListener('loadedmetadata', function () {
      var time = data.time || 0;
      if (time > 0 && isFinite(media.duration)) {
        if (time >= media.duration) {
          showIdle('Siaran selesai');
          return;
        }
        media.currentTime = time;
      }
    });
    media.addEventListener('ended', function () { showIdle('Siaran selesai'); });
    media.addEventListener('error', function () { showIdle('Media tidak dapat diputar'); });
    media.src = data.src;
    element = media;
    if (visible) {
      stage.appendChild(media);
      showStage();
    } else {
      subtitle.textContent = 'Memutar audio';
      idle.classList.remove('hidden');
    }
  }

  function playImage(data) {
    var img = document.createElement('img');
    img.addEventListener('error', function () { showIdle('Gambar tidak dapat dimuat'); });
    img.src = data.src;
    stage.appendChild(img);
    showStage();
  }

  function play(data) {
    clear();
    if (data.type === 'youtube') playYoutube(data);
    else if (data.type === 'video') playElement('video', data, true);
    else if (data.type === 'audio') playElement('audio', data, false);
    else if (data.type === 'image') playImage(data);
    else showIdle();
  }

  function setVolume(volume) {
    if (queued) queued.volume = volume;
    if (player && player.setVolume) {
      try { player.setVolume(volume); } catch (e) {}
    }
    if (element) element.volume = volume / 100;
  }

  window.onYouTubeIframeAPIReady = function () {
    apiReady = true;
    if (queued) {
      var data = queued;
      queued = null;
      playYoutube(data);
    }
  };

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || !data.action) return;
    if (data.action === 'play') play(data);
    else if (data.action === 'volume') setVolume(data.volume);
    else if (data.action === 'stop' || data.action === 'idle') showIdle();
  });

  post('sm_tv:duiReady');
})();
</script>
</body>
</html>
