<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 18px;
      width: 480px;
      padding: 18px 22px;
      border-radius: 14px;
      background: rgba(20, 21, 24, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .name {
      font-size: 22px;
      font-weight: 600;
      color: #e6e8eb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta:empty {
      display: none;
    }

    .reason {
      font-size: 17px;
      font-weight: 500;
      color: #f1c40f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reason.crash { color: #f17171; }
    .reason.timeout { color: #e0a84a; }

    .status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #e74c3c;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #e74c3c;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="" />
    <div class="info">
      <div id="name" class="name"></div>
      <div id="meta" class="meta"></div>
      <div id="reason" class="reason"></div>
    </div>
    <div class="status">
      <div id="status"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reason = document.getElementById('reason');

    document.getElementById('name').textContent = params.get('name') || 'PLAYER';
    document.getElementById('meta').textContent = params.get('meta') || '';
    document.getElementById('status').textContent = params.get('status') || 'LEFT';
    reason.textContent = params.get('reason') || 'Disconnected';
    reason.classList.add(params.get('type') || 'exit');
  </script>
</body>
</html>
