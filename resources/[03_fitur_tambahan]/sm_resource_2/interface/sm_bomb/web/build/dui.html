<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #070808;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Consolas, monospace;
            color: #e5322f;
        }

        #timer {
            font-size: 132px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 4px;
        }

        #timer.idle {
            color: #3a1514;
        }
    </style>
</head>

<body>
    <div id="timer" class="idle">--:--</div>

    <script>
        const timer = document.getElementById('timer');
        let ends = null;
        let offset = 0;
        let volume = 0;
        let lastBeep = 0;
        let soundUrl = null;

        fetch('./tiktak.ogg')
            .then((resp) => resp.blob())
            .then((blob) => { soundUrl = URL.createObjectURL(blob); })
            .catch(() => {});

        const beep = () => {
            if (!soundUrl || volume <= 0.01) return;
            const audio = new Audio(soundUrl);
            audio.volume = Math.min(1, volume);
            audio.play().catch(() => {});
        };

        const format = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        };

        setInterval(() => {
            if (ends === null) return;
            const nowSec = Date.now() / 1000 + offset;
            const remaining = Math.max(0, Math.ceil(ends - nowSec));
            timer.textContent = format(remaining);
            if (remaining <= 0) return;

            const interval = remaining <= 10 ? 500 : 1000;
            const now = Date.now();
            if (now - lastBeep >= interval) {
                lastBeep = now;
                beep();
            }
        }, 100);

        window.addEventListener('message', (event) => {
            const data = event.data || {};
            if (data.action === 'state') {
                ends = typeof data.ends === 'number' ? data.ends : null;
                offset = typeof data.now === 'number' ? data.now - Date.now() / 1000 : 0;
                timer.classList.toggle('idle', ends === null);
                if (ends === null) timer.textContent = '--:--';
            } else if (data.action === 'volume') {
                volume = Number(data.value) || 0;
            } else if (data.action === 'stop') {
                ends = null;
                volume = 0;
                timer.classList.add('idle');
                timer.textContent = '--:--';
            }
        });
    </script>
</body>

</html>
